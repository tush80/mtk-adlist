name: Process Host Text Files

on:
  push:
    paths:
      - 'source_files/*.txt'
  workflow_dispatch: # Allows manual triggers from GitHub UI

permissions:
  contents: write

jobs:
  process-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Text Files
        run: |
          python -c '
          import os

          # Define targets
          input_dir = "source_files"
          output_dir = "processed_files"
          target_files = ["pro-onlydomains.txt", "doh-vpn-proxy-bypass-onlydomains.txt", "tif-onlydomains.txt"]

          os.makedirs(output_dir, exist_ok=True)

          for filename in target_files:
              in_path = os.path.join(input_dir, filename)
              out_path = os.path.join(output_dir, filename)

              if not os.path.exists(in_path):
                  print(f"Skipping {in_path}: File not found.")
                  continue

              processed_lines = []
              with open(in_path, "r", encoding="utf-8") as infile:
                  for line in infile:
                      stripped = line.strip()
                      # Preserve comments and blank lines
                      if not stripped or stripped.startswith("#"):
                          processed_lines.append(line)
                      else:
                          # Prepend "0.0.0.0 " to domain/host entries
                          processed_lines.append(f"0.0.0.0 {stripped}\n")

              with open(out_path, "w", encoding="utf-8") as outfile:
                  outfile.writelines(processed_lines)

              print(f"Successfully processed {in_path} -> {out_path}")
          '

      - name: Commit and Push Processed Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update processed txt files [skip ci]"
          file_pattern: 'processed_files/*.txt'
          branch: ${{ github.ref_name }}
