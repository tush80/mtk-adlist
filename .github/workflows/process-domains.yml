name: Process Domain Files

on:
  schedule:
       - cron: '50 1 * * *'
         timezone: "Europe/Sofia"
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  process-files:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to commit processed files back to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Process domain files
        run: |
          FILES=(
            "pro-onlydomains.txt"
            "doh-vpn-proxy-bypass-onlydomains.txt"
            "tif-onlydomains.txt"
          )

          for file in "${FILES[@]}"; do
            SRC_PATH="source_files/$file"
            DEST_PATH="processed_files/$file"

            if [ -f "$SRC_PATH" ]; then
              # 1. 'grep -v "^#"' removes comment lines starting with #
              # 2. 'grep -v "^$"' strips empty/blank lines
              # 3. 'sed' prepends "0.0.0.0 " to each line
              grep -v '^#' "$SRC_PATH" | grep -v '^$' | sed 's/^/0.0.0.0 /' > "$DEST_PATH"
              echo "Processed $SRC_PATH -> $DEST_PATH"
            else
              echo "Warning: $SRC_PATH not found, skipping."
            fi
          done
      - name: Commit and push processed files
        run: |
          git config --global user.name "tush80"
          git config --global user.email "tush@mail.bg"
          git add processed_files/
          if git diff --staged --quiet; then
            echo "No changes detected in processed files."
          else
            git commit -m "auto: update processed domain blocklists"
            git push
          fi
